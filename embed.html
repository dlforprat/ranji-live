      const c = el('button', 'rx-star' + (r.kind === 'India watch' ? ' rx-india' : ''));
      const top = el('div', 'rx-star-top');
      top.append(el('span', 'rx-star-rank', 'No. ' + (i + 1)), badge(r.team, 'sm'));
      c.append(top, el('div', 'rx-star-feat', r.feat), el('div', 'rx-star-name', r.player), el('div', 'rx-star-note', r.team + ' · ' + r.note), el('div', 'rx-star-tag', r.kind));
      c.title = 'Open ' + r.player + "'s game";
      c.addEventListener('click', () => openGame(r.matchId));
      return c;
    }));
    more.hidden = rows.length <= 6;
    more.textContent = state.allStars ? 'Show top 6' : 'See all ' + rows.length;
  };
  $('stand-more').addEventListener('click', () => { state.allStars = !state.allStars; draw(); });

  const order = () => sortRows((rowsOf('matches') || []).filter(pass));
  const neighbours = () => {
    const o = order(), i = o.findIndex((r) => r.id === state.game);
    return { prev: i > 0 ? o[i - 1].id : null, next: i >= 0 && i < o.length - 1 ? o[i + 1].id : null };
  };
  const copyText = (text, node, btn) => {
    const ok = () => { btn.textContent = 'Copied ✓'; setTimeout(() => (btn.textContent = 'Copy summary'), 1600); };
    const fallback = () => { try { const r = document.createRange(); r.selectNodeContents(node); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected — press Ctrl/⌘+C'; } catch (e) {} };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  };

  const drawGame = (m, inns, s) => {
    const sec = $('game');
    const r = m && m.find((x) => x.id === state.game);
    if (!r) { sec.replaceChildren(el('p', 'rx-muted', m ? 'That game is not in this round any more.' : '')); return; }

    const bar = el('div', 'rx-dbar');
    const back = el('button', 'rx-nav', '← All games');
    back.addEventListener('click', closeGame);
    const nb = neighbours();
    const steps = el('div', 'rx-steps');
    const prev = el('button', 'rx-nav', '‹ Previous'), next = el('button', 'rx-nav', 'Next ›');
    prev.disabled = !nb.prev; next.disabled = !nb.next;
    prev.addEventListener('click', () => nb.prev && openGame(nb.prev));
    next.addEventListener('click', () => nb.next && openGame(nb.next));
    steps.append(prev, next);
    bar.append(back, steps);

    const hero = el('div', 'rx-hero');
    const meta = el('div', 'rx-cmeta');
    meta.append(el('span', null, gname(r.group) + ' · ' + r.venue + ' · ' + (r.state === 'Finished' ? 'Result' : r.status)), stateTag(r.state));
    const teams = el('div', 'rx-teams');
    teams.append(teamRow(r.teamA, r.scoreA, r.teamA === r.firstInningsLead, 'lg'), teamRow(r.teamB, r.scoreB, r.teamB === r.firstInningsLead, 'lg'));
    const act = el('div', 'rx-actions');
    const a = el('a', 'rx-btn', r.scorecardExact ? 'Full scorecard ↗' : 'Find scorecard ↗');
    a.href = r.scorecardUrl; a.target = '_blank'; a.rel = 'noopener'; a.title = 'Opens on ESPNcricinfo';
    act.append(a);
    hero.append(meta, teams, el('div', 'rx-hsit', r.result || r.situation), act);

    const cols = el('div', 'rx-cols');
    const left = el('div');
    if (r.endSummary) {
      left.append(el('h3', 'rx-h3', 'Match summary'));
      const p = el('p', 'rx-summary', r.endSummary);
      const b = el('button', 'rx-btn rx-ghost', 'Copy summary');
      b.addEventListener('click', () => copyText(r.endSummary, p, b));
      left.append(p, b, el('div', 'rx-gap'));
    }
    left.append(el('h3', 'rx-h3', 'Key insights'));
    const ins = el('ul', 'rx-ins');
    split(r.notes).forEach((n) => ins.append(el('li', null, n)));
    left.append(ins);
    const st = (s || []).filter((x) => x.matchId === r.id).sort((x, y) => x.rank - y.rank);
    if (st.length) {
      left.append(el('div', 'rx-gap'), el('h3', 'rx-h3', 'Standouts'));
      const strip = el('div', 'rx-strip');
      strip.style.gridAutoColumns = 'minmax(11rem, 1fr)';
      st.forEach((x) => {
        const c = el('div', 'rx-star' + (x.kind === 'India watch' ? ' rx-india' : ''));
        c.style.cursor = 'default';
        const top = el('div', 'rx-star-top'); top.append(el('span', 'rx-star-rank', 'Round No. ' + x.rank), badge(x.team, 'sm'));
        c.append(top, el('div', 'rx-star-feat', x.feat), el('div', 'rx-star-name', x.player), el('div', 'rx-star-note', x.note));
        strip.append(c);
      });
      left.append(strip);
    }

    const right = el('div');
    right.append(el('h3', 'rx-h3', 'Innings by innings'));
    const list = el('div', 'rx-inns');
    const mine = (inns || []).filter((x) => x.matchId === r.id).sort((x, y) => x.n - y.n);
    if (!mine.length) list.append(el('p', 'rx-muted', inns ? 'Innings details arrive with the next update.' : ''));
    mine.forEach((x) => {
      const row = el('div', 'rx-inn');
      const mid = el('div');
      mid.append(el('div', 'rx-inn-n', (ORD[x.n - 1] || x.n + 'th') + ' innings'), el('div', 'rx-inn-t', x.team));
      row.append(badge(x.team, 'sm'), mid, el('div', 'rx-inn-tot', x.total || '—'));
      const p = el('div', 'rx-inn-p');
      const bat = split(x.batting), bowl = split(x.bowling);
      if (bat.length) { p.append(el('b', null, 'Bat  '), document.createTextNode(bat.join(' · '))); }
      if (bowl.length) { if (bat.length) p.append(el('br')); p.append(el('b', null, 'Bowl  '), document.createTextNode(bowl.join(' · '))); }
      if (!bat.length && !bowl.length) p.append(document.createTextNode('Details not yet picked up'));
      row.append(p);
      list.append(row);
    });
    right.append(list);
    cols.append(left, right);
    sec.replaceChildren(bar, hero, cols);
  };

  const draw = () => {
    const m = rowsOf('matches');
    drawTabs(m);
    drawHeader();
    const detail = !!state.game;
    $('list-view').hidden = detail;
    $('game').hidden = !detail;
    if (detail) drawGame(m, rowsOf('innings'), rowsOf('standouts'));
    else { drawStars(rowsOf('standouts'), m); drawGames(m); }
  };

  const h = location.hash.slice(1);
  if (h.startsWith('game-')) state.game = h.slice(5);
  else if (h.startsWith('tab-')) { const t = TABS.find(([k]) => 'tab-' + k.toLowerCase() === h); if (t) state.tab = t[0]; }

  dash.onData(draw);
})();
}
</script>
